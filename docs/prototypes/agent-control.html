function team(){return A.filter(x=>x!==COS).map(x=>{const it=(abl[x.id]||[])[0];return it?'- '+x.n+' ('+x.area.n+'), '+it.task+', '+new Date(it.at).toLocaleDateString('de-DE')+':\n'+it.text.slice(0,700):null}).filter(Boolean).join('\n\n')}
async function run(a){if(!sample||a.state==='arbeitet')return;const task=a.tasks[a.task];
 let prompt=context()+'\n\nDu bist '+a.n+' ('+a.r+') in der Abteilung '+a.area.n+' bei MotoDigital. Deine Verantwortung: '+a.job+' Deine Kennzahl: '+a.kpi+'.\nArbeite wie ein erfahrener Mitarbeiter: Liefere ein fertiges, direkt nutzbares Arbeitsergebnis statt allgemeiner Ratschläge. Fehlt dir eine Information, triff eine klar gekennzeichnete Annahme oder setze einen Platzhalter in eckigen Klammern. Schließe mit einer Zeile „Nächster Schritt:“. Nichts wird ohne Freigabe des Gründers veröffentlicht oder versendet. Höchstens 220 Wörter, kein Vorwort.\n\nAufgabe: '+task.p;
 if(task.ab){const tm=team();prompt+='\n\nLetzte Ergebnisse der Abteilungen:\n'+(tm||'Noch keine Ergebnisse vorhanden. Sag das und schlage vor, welche Abteilungen zuerst arbeiten sollten.')}
 if(a.det.trim())prompt+='\n\nDetails vom Gründer:\n'+a.det.trim();
 if(a.inbox)prompt+='\n\nÜbergabe von deinem Kollegen '+a.inbox.from+':\n'+a.inbox.text;
 a.state='arbeitet';a.out='';if(sel&&sel.a===a)renderAgent();styleNodes();
 try{const r=await sample(prompt,{onText:({text})=>{a.out=text;if(sel&&sel.a===a&&outEl){outEl.textContent=text;outEl.classList.remove('empty')}},cache:false,modelTier:'default'});
  a.out=r.text;a.state='fertig';a.inbox=null;packet(a);await file(a,task.t,r.text)}
 catch(e){a.state='bereit';a.out=e&&e.code==='not_granted'?'Freigabe wurde nicht erteilt.':e&&e.code==='rate_limited'?'Zu viele Anfragen, bitte kurz warten.':'Der Mitarbeiter konnte nicht antworten.'}
 if(sel&&sel.a===a)renderAgent();styleNodes()}
async function file(a,task,text){const items=[{task,text,at:Date.now()},...(abl[a.id]||[])].slice(0,12);abl[a.id]=items;
 if(db&&canEdit){try{await db.doc('ablage/'+a.id).set({items})}catch(e){}}}

// ---------- Start ----------
intro();
(async()=>{try{sample=await window.claude?.use('sample')}catch(e){}
 if(!sample)$('note').textContent='Live-Arbeit ist hier nicht verfügbar. Die Ansicht läuft trotzdem.';
 if(sel&&sel.kind==='agent')renderAgent()})();
(async()=>{try{db=await window.claude?.use('db')}catch(e){}
 try{const u=await window.claude?.use('user');canEdit=u?await u.canEdit():false}catch(e){}
 if(!db)return;
 const typing=()=>document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#panel');
 db.doc('plattform/stats').onSnapshot(d=>{stats=d.exists?d.data():{};renderCafe();if(sel&&sel.kind==='cafe'&&!typing())pickCafe()},()=>{});
 db.doc('zentrale/briefing').onSnapshot(d=>{briefing=d.exists?(d.data().text||''):'';if(sel&&sel.kind==='cafe'&&!typing())pickCafe()},()=>{});
 db.collection('ablage').onSnapshot(snap=>{snap.docs.forEach(d=>{abl[d.id]=(d.data().items)||[]});if(sel&&sel.kind==='agent'&&sel.a.state!=='arbeitet'&&!typing())renderAgent()},()=>{});
})();
</script></body></html>
